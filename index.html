<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Arc Path Builder</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<aside class="panel">
  <header class="panel-head">
    <h1>Arc Path Builder</h1>
    <p class="hint">Every connection is one arc of 0° (straight), 30°, 45°, 60° or 90°, departing along the previous arc's tangent.</p>
  </header>

  <section class="controls">
    <label class="ctl">
      <span>Initial heading <em id="v-heading">0°</em></span>
      <input id="initialHeading" type="range" min="-180" max="180" step="1" value="0" />
    </label>

    <label class="ctl">
      <span>Angular tolerance <em id="v-tol">2°</em></span>
      <input id="tolerance" type="range" min="0" max="15" step="0.5" value="2" />
      <p class="ctl-note">How far a point may sit off an exact guide ray and still be accepted. At 0° only perfect placements count; higher values forgive near-misses. Nothing moves — the slack is absorbed as a small kink at the joint.</p>
    </label>

    <label class="ctl" data-feature="duct">
      <span>Duct width <em id="v-duct">18</em></span>
      <input id="ductWidth" type="range" min="2" max="120" step="1" value="18" />
    </label>

    <label class="ctl" data-feature="jacket">
      <span>Jacket diameter <em id="v-jacket">40</em></span>
      <input id="jacketWidth" type="range" min="2" max="200" step="1" value="40" />
      <p class="ctl-note" id="jacketNote"></p>
    </label>

    <label class="ctl" data-feature="minBendRadius">
      <span>Min bend radius <em id="v-ratio">1.5 × D</em></span>
      <input id="minRadiusRatio" type="range" min="0.5" max="4" step="0.1" value="1.5" />
      <p class="ctl-note" id="ratioNote"></p>
    </label>

    <div class="toggles">
      <label data-feature="duct"><input id="showDuct" type="checkbox" checked /> Duct</label>
      <label data-feature="jacket"><input id="showJacket" type="checkbox" checked /> Jacket</label>
      <label data-feature="guideRays"><input id="showGuides" type="checkbox" checked /> Guide rays</label>
      <label data-feature="snapping"><input id="snapEnabled" type="checkbox" checked /> Snap</label>
    </div>
  </section>

  <p id="notice" class="notice" hidden></p>
  <p id="summary" class="summary"></p>

  <section class="table-wrap">
    <table class="pts">
      <thead>
        <tr><th>#</th><th>x</th><th>y</th><th>Arc in</th><th></th></tr>
      </thead>
      <tbody id="ptBody"></tbody>
    </table>
  </section>

  <footer class="panel-foot">
    <button id="btnAdd" class="btn">Add point</button>
    <button id="btnFit" class="btn">Fit</button>
    <button id="btnClear" class="btn">Clear</button>
    <button id="btnExport" class="btn" data-feature="importExport">Export</button>
    <button id="btnImport" class="btn" data-feature="importExport">Import</button>
    <button id="btnCross" class="btn btn--wide" data-feature="crossLink,threeD">Open this path in 3D →</button>
    <input id="fileInput" type="file" accept="application/json,.json" hidden />
  </footer>
</aside>

<main class="stage">
  <svg id="canvas" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet">
    <defs>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1d2530" stroke-width="1" />
      </pattern>
    </defs>
    <rect x="-20000" y="-20000" width="40000" height="40000" fill="url(#grid)" />
    <g id="layer-guides"></g>
    <g id="layer-jacket"></g>
    <g id="layer-duct"></g>
    <g id="layer-path"></g>
    <g id="layer-markers"></g>
    <g id="layer-points"></g>
  </svg>
  <p class="stage-hint">Drag to pan · scroll to zoom · drag a point to move it</p>
</main>

<script type="module" src="src/2d/main.js"></script>
</body>
</html>
